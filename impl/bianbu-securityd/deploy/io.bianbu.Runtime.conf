<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Runtime system-bus policy. Runtime owns its name; management callers are
     restricted to bianbu-admin/root, while the Security group may use the
     lifecycle/query methods required by the trusted integration. -->
<busconfig>
  <policy user="root">
    <allow own="io.bianbu.Runtime"/>
    <allow send_destination="io.bianbu.Runtime"/>
  </policy>
  <policy group="bianbu-runtime">
    <allow own="io.bianbu.Runtime"/>
  </policy>
  <policy context="default">
    <deny send_destination="io.bianbu.Runtime"
          send_interface="io.bianbu.Runtime"/>
    <allow send_destination="io.bianbu.Runtime"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.bianbu.Runtime"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy group="bianbu-security">
    <allow send_destination="io.bianbu.Runtime"
           send_interface="io.bianbu.Runtime"/>
  </policy>
  <policy group="bianbu-admin">
    <allow send_destination="io.bianbu.Runtime"
           send_interface="io.bianbu.Runtime"/>
  </policy>
</busconfig>
