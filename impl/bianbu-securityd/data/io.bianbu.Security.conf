<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  发布资产镜像；生产安装唯一来源为 deploy/io.bianbu.Security.conf。
  两份文件保持相同的 D-Bus policy 语义，避免构建/安装校验因资产漂移失败。
-->
<busconfig>

  <!-- 谁能持有这个总线名 -->
  <policy user="root">
    <allow own="io.bianbu.Security"/>
  </policy>
  <policy group="bianbu-security">
    <allow own="io.bianbu.Security"/>
  </policy>

  <!-- 默认：允许判权与只读查询；管理操作由 bianbu-admin 组控制 -->
  <policy context="default">
    <!-- 兜底拒绝必须位于逐项 allow 之前 -->
    <deny send_destination="io.bianbu.Security"
          send_interface="io.bianbu.Security"/>
    <deny send_destination="io.bianbu.Security"
          send_interface="io.bianbu.Security.Runtime"/>

    <allow send_destination="io.bianbu.Security"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="org.freedesktop.DBus.Properties"/>

    <!-- 判权 / 确认 / 计量 / 审计写入 -->
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="CheckPermission"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="CheckPermissionV2"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RequestConfirm"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RequestConfirmV2"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RespondConfirm"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="AuditLog"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="BuildSandboxPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetSyscallCatalog"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetSyscallPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetSecurityExecutionStatus"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="SetGlobalSyscallPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="SetAgentSyscallPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="ResetAgentSyscallPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RecordSyscallInterception"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="VerifyManifest"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RegisterCapabilities"/>

    <!-- 只读查询 -->
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetCapabilities"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetAgentInfo"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GetNetworkPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="ListAgents"/>

    <!-- 接收 securityd 信号 -->
    <allow receive_sender="io.bianbu.Security"/>
  </policy>

  <!-- 管理类方法（含 Agent normal/yolo 安全模式读写）：仅 bianbu-admin 组 -->
  <policy group="bianbu-admin">
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security"/>
  </policy>

  <!-- Runtime 身份及 Agent 绑定 -->
  <policy group="bianbu-security">
    <!-- Logical Agent lifecycle is owned by the Runtime service.  The service
         still validates the payload and records an audit entry; restricting
         these mutating calls to the dedicated Runtime group prevents an
         arbitrary desktop process from granting itself capabilities. -->
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RegisterAgent"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="UnregisterAgent"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="SyncAgentCapabilities"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="BindAgent"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="BindAgentV2"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="GrantSessionTrustV2"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="RecordNetworkLearningEvent"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security" send_member="ReportNetworkLearningCollector"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="PrepareStart"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="GetSandboxPolicy"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="CommitStart"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="AbortStart"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="RevokeAgent"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="GetRuntimeState"/>
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security.Runtime" send_member="ListRuntimeInstances"/>
  </policy>

  <policy user="root">
    <allow send_destination="io.bianbu.Security"
           send_interface="io.bianbu.Security"/>
  </policy>

</busconfig>
