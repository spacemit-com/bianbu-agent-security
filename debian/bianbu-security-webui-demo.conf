# Development/demo DEB delivery override.
#
# WebUI Bearer-token authentication is deliberately disabled for the
# development/demo package so the console can be started without provisioning
# a production secret.  The authentication implementation remains in the
# WebUI code and the product package must omit this drop-in.
[Service]
# Remove credentials inherited from a stale production environment file.  The
# other settings in that file (host, port, TLS and shell policy) remain useful
# for demo operation.  Product deployments remove this drop-in and regain the
# normal token policy.
UnsetEnvironment=BIANBU_WEBUI_TOKEN BIANBU_WEBUI_VIEWER_TOKEN
Environment=BIANBU_WEBUI_DEMO=1
Environment=BIANBU_WEBUI_AUTH=0
